rules:
  - id: c-unsafe-string-copy
    pattern-either:
      - pattern: strcpy($DST, $SRC)
      - pattern: strcat($DST, $SRC)
      - pattern: sprintf($DST, ...)
      - pattern: vsprintf($DST, $FMT, $AP)
      - pattern: gets($DST)
    message: >
      Unbounded string or buffer operation detected (CWE-120). Functions such as
      strcpy, strcat, sprintf, vsprintf, and gets do not enforce destination buffer
      bounds and can cause stack/heap buffer overflows. Prefer bounded alternatives
      such as snprintf, vsnprintf, strlcpy, or fgets.
    severity: ERROR
    languages: [c, cpp]
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      category: security
      confidence: HIGH

  - id: c-command-injection
    patterns:
      - pattern-either:
          - pattern: system($CMD)
          - pattern: popen($CMD, $MODE)
      - pattern-not: system("...")
      - pattern-not: popen("...", $MODE)
    message: >
      Dynamic command passed to system() or popen() (CWE-78). Invoking a shell
      with non-literal input may allow OS command injection. Prefer execv/execvp
      with explicit argument arrays and strict input allowlists.
    severity: ERROR
    languages: [c, cpp]
    metadata:
      cwe: "CWE-78: OS Command Injection"
      category: security
      confidence: MEDIUM

  - id: c-format-string-vuln
    patterns:
      - pattern-either:
          - pattern: printf($FMT)
          - pattern: fprintf($STREAM, $FMT)
          - pattern: syslog($PRIO, $FMT)
      - pattern-not: printf("...")
      - pattern-not: fprintf($STREAM, "...")
      - pattern-not: syslog($PRIO, "...")
    message: >
      Non-literal format string passed directly to formatted output function (CWE-134).
      Attacker-controlled format specifiers (%n, %x, %s) can leak memory or achieve
      arbitrary write. Always use a literal format string such as "%s".
    severity: ERROR
    languages: [c, cpp]
    metadata:
      cwe: "CWE-134: Use of Externally-Controlled Format String"
      category: security
      confidence: HIGH

  - id: c-integer-overflow-alloc
    patterns:
      - pattern-either:
          - pattern: malloc($A * $B)
          - pattern: realloc($PTR, $A * $B)
      - pattern-not: malloc($N * sizeof(...))
      - pattern-not: realloc($PTR, $N * sizeof(...))
    message: >
      Unchecked integer multiplication inside heap allocation (CWE-190 / CWE-680).
      Multiplication overflow can cause under-allocation followed by heap buffer
      overflow. Validate multiplication bounds or use calloc(count, elem_size).
    severity: WARNING
    languages: [c, cpp]
    metadata:
      cwe: "CWE-190: Integer Overflow or Wraparound"
      category: security
      confidence: MEDIUM

  - id: c-insecure-temp-file
    pattern-either:
      - pattern: mktemp($TMPL)
      - pattern: tmpnam($BUF)
      - pattern: tempnam($DIR, $PFX)
    message: >
      Insecure temporary filename function detected (CWE-377). Race condition (TOCTOU)
      between filename generation and opening allows symlink attacks. Use mkstemp()
      or tmpfile() instead.
    severity: WARNING
    languages: [c, cpp]
    metadata:
      cwe: "CWE-377: Insecure Temporary File"
      category: security
      confidence: HIGH
